# Global tool versions. Per-project mise.toml files override these on cd.
[tools]
go = "latest"
node = "lts"
pnpm = "latest"
# The rust core plugin drives rustup under the hood; `cargo`/`rustc` come with it.
rust = "latest"
uv = "latest"

[settings]
go.set_gobin = false
python.uv_venv_auto = "create|source"
